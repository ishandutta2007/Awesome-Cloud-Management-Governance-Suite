<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1deg)}}@keyframes pulseGlow{0%{opacity:.3}50%{opacity:.6}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.animated-card-1,.animated-card-2{animation:float1 6s ease-in-out infinite;transform-origin:center}.animated-card-2{animation:float2 8s ease-in-out infinite}.glowing-orb{animation:pulseGlow 4s ease-in-out infinite}.flowing-line{stroke-dasharray:10,10;animation:dash 3s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="180" fill="#38bdf8" class="glowing-orb" filter="url(#glow)" opacity=".15"/><circle cx="1000" cy="300" r="220" fill="#c084fc" class="glowing-orb" filter="url(#glow)" opacity=".15"/><pa