<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Glow -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle Dynamic CSS Animations */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.6; }
      100% { opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-card-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
    .animated-card-2 { animation: float2 8s ease-in-out infinite; transform-origin: center; }
    .glowing-orb { animation: pulseGlow 4s ease-in-out infinite; }
    .flowing-line { stroke-dasharray: 10, 10; animation: dash 3s linear infinite; }
  </style>

  <!-- Dark Rich Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Animated Orbs / Dynamic aspect -->
  <circle cx="200" cy="100" r="180" fill="#38bdf8" class="glowing-orb" filter="url(#glow)" opacity="0.15" />
  <circle cx="1000" cy="300" r="220" fill="#c084fc" class="glowing-orb" filter="url(#glow)" opacity="0.15" />

  <!-- Background Grid Lines -->
  <path d="M0,100 H1200 M0,200 H1200 M0,300 H1200 M300,0 V400 M600,0 V400 M900,0 V400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Decorative Tech Elements in Background (Underneath Text) -->
  <g class="animated-card-1" opacity="0.4">
    <rect x="820" y="60" width="300" height="110" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="850" cy="95" r="12" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <path d="M845 95 L849 99 L856 91" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="875" y="92" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0">Policy Guardrails</text>
    <text x="875" y="110" font-family="system-ui" font-size="12" fill="#94a3b8">Preventive Security Posture</text>
    <rect x="850" y="130" width="180" height="8" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="850" y="130" width="130" height="8" rx="4" fill="#38bdf8" />
  </g>

  <g class="animated-card-2" opacity="0.4">
    <rect x="850" y="210" width="290" height="120" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="880" cy="250" r="14" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="2" />
    <text x="876" y="255" font-family="system-ui" font-size="14" font-weight="bold" fill="#c084fc">$</text>
    <text x="905" y="248" font-family="system-ui" font-size="14" font-weight="600" fill="#e2e8f0">FinOps &amp; Governance</text>
    <text x="905" y="266" font-family="system-ui" font-size="12" fill="#94a3b8">Automated Cost Controls</text>
    <path d="M880 300 L930 285 L970 295 L1020 275 L1100 285" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Connecting Flowing Line -->
  <path d="M780 115 C 800 200, 800 220, 830 270" fill="none" stroke="#818cf8" stroke-width="2" class="flowing-line" opacity="0.5" />

  <!-- FOREGROUND TEXT AND BADGES (Always Clear and Visible) -->
  <!-- Top Badge -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" class="badge-text">CLOUD GOVERNANCE &amp; FINOPS</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="160" class="title">Awesome Cloud Management &amp;</text>
  <text x="80" y="215" class="title" fill="url(#accentGrad)">Governance Suite 🛡️ ☁️</text>

  <!-- Subtitle -->
  <text x="80" y="265" class="subtitle">Curated list of commercial platforms, open-source policy engines,</text>
  <text x="80" y="295" class="subtitle">FinOps tools, and preventive security guardrails.</text>

  <!-- Bottom Accent Line -->
  <rect x="80" y="335" width="480" height="4" rx="2" fill="url(#accentGrad)" />
</svg>
